<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Board Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Grid Matrix Dots for Whiteboard feel -->
  <g fill="#93c5fd" opacity="0.4">
    <circle cx="120" cy="120" r="4" />
    <circle cx="200" cy="120" r="4" />
    <circle cx="280" cy="120" r="4" />
    <circle cx="360" cy="120" r="4" />
    <circle cx="120" cy="200" r="4" />
    <circle cx="200" cy="200" r="4" />
    <circle cx="280" cy="200" r="4" />
    <circle cx="360" cy="200" r="4" />
    <circle cx="120" cy="280" r="4" />
    <circle cx="200" cy="280" r="4" />
    <circle cx="280" cy="280" r="4" />
    <circle cx="360" cy="280" r="4" />
    <circle cx="120" cy="360" r="4" />
    <circle cx="200" cy="360" r="4" />
    <circle cx="280" cy="360" r="4" />
    <circle cx="360" cy="360" r="4" />
  </g>

  <!-- Mathematical Integral / Wave symbol & AI Spark -->
  <path d="M140 330 C 180 370, 210 320, 240 256 C 270 192, 300 140, 350 170" 
        fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M170 190 L 320 310" 
        fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />

  <!-- Pen Stylus Tip -->
  <polygon points="360,130 400,170 380,190 340,150" fill="#ffffff" />
  <polygon points="400,170 415,185 395,205 380,190" fill="#fbbf24" />

  <!-- Sparkles -->
  <path d="M 390 280 Q 390 310 420 310 Q 390 310 390 340 Q 390 310 360 310 Q 390 310 390 280 Z" fill="#facc15" />
</svg>
